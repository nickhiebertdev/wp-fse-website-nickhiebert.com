name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: [self-hosted, ftp-deploy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: FTP Deploy - Child Theme
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: wp-content/themes/wp-child-theme-wp-fse-website-nickhiebert/
          server-dir: wp-fse-website-nickhiebert/wp-content/themes/wp-child-theme-wp-fse-website-nickhiebert/

      # Once the blocks plugin folder exists as a sibling to the theme, add a second step here:
      # - name: FTP Deploy - Blocks Plugin
      #   uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      #   with:
      #     server: ${{ secrets.FTP_SERVER }}
      #     username: ${{ secrets.FTP_USERNAME }}
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     local-dir: wp-content/plugins/your-blocks-plugin-name/
      #     server-dir: wp-fse-website-nickhiebert/wp-content/plugins/your-blocks-plugin-name/
